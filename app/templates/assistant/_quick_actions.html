<section class="ap-assistant-actions" aria-labelledby="ap-assistant-actions-title">
    <h3 id="ap-assistant-actions-title" class="ap-assistant-sr-only">Acciones rápidas</h3>
    <div class="ap-assistant-action-list">
        <button type="button" class="ap-assistant-action" data-assistant-action="top_products" data-assistant-label="Productos que más vendí esta semana">
            <span class="ap-assistant-action-emoji" aria-hidden="true">🛒</span>
            <span class="ap-assistant-action-text">Productos que más vendí esta semana</span>
        </button>
        <button type="button" class="ap-assistant-action" data-assistant-action="sales_7d" data-assistant-label="Ventas de los últimos 7 días">

        </button>
        <button type="button" class="ap-assistant-action" data-assistant-action="export_sales_excel" data-assistant-label="Descargar Excel de ventas">

        <button type="button" class="ap-assistant-action" data-assistant-action="pending_tasks" data-assistant-label="Tareas pendientes">
